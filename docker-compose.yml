services:
  web:
    build: .
    image: calendrier-ffe-web
    container_name: calendrier-ffe-web
    restart: unless-stopped
    environment:
      # Adresse de l'API vue depuis le NAVIGATEUR (pas depuis le conteneur), réglable dans .env
      API_URL: ${API_URL:-http://127.0.0.1:8765}
    ports:
      # Port et adresse d'écoute sur la machine hôte, réglables dans .env (WEB_PORT, WEB_BIND)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      # Les modifications de public/ sont visibles sans reconstruire l'image (simple rechargement de la page)
      - ./public:/usr/share/nginx/html:ro

    # --- Durcissement : système de fichiers en lecture seule, privilèges minimaux, ressources bornées
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m      # configuration générée au démarrage depuis le modèle
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop:
      - ALL
    cap_add:                            # le strict nécessaire à nginx (port 80, passage à l'utilisateur nginx)
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
